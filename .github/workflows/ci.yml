name: ci
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
      valkey:
        image: valkey/valkey:8
        ports: ["6379:6379"]
    env:
      TEST_DATABASE_ADMIN_URL: postgresql+psycopg://postgres:postgres@localhost:5432/postgres
      VALKEY_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0
      - run: pip install -e . pypdf pytest pytest-cov ruff mypy types-PyYAML pip-audit bandit
      - run: python infra/ci/check_no_em_dash.py
      - run: ruff check apps data tests infra training services
      - run: mypy -p data.scripts
      - run: MYPYPATH=apps/api:. mypy --strict -p app
      - run: mypy services training
      - run: python -m training.train --dry-run
      - run: PYTHONPATH=.:apps/api pytest --cov=app --cov-fail-under=80
      - run: pip-audit
      - run: bandit -q -r apps/api/app data services training -x '*/tests/*'
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npx prettier --check .
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run audit:gate

  web-e2e:
    runs-on: ubuntu-latest
    needs: web
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
      valkey:
        image: valkey/valkey:8
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -e .
      - run: |
          export PYTHONPATH=.:apps/api
          DATABASE_URL=$(python apps/web/e2e/seed_api.py postgresql://postgres:postgres@localhost:5432/postgres)
          echo "DATABASE_URL=$DATABASE_URL" >> "$GITHUB_ENV"
      - run: |
          PYTHONPATH=apps/api:. nohup uvicorn --factory app.main:create_app --port 8000 > api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/api/v1/health/ready && break; sleep 1; done
          python apps/web/e2e/seed_suppliers.py http://127.0.0.1:8000
        env:
          VALKEY_URL: redis://localhost:6379/0
          COOKIE_SECURE: "false"
          ALLOW_EPHEMERAL_SECRETS: "true"
          RATE_LIMIT_LOGIN_ACCOUNT: 1000/900
          RATE_LIMIT_LOGIN_IP: 1000/60
          WEB_BASE_URL: http://127.0.0.1:3000
      - working-directory: apps/web
        run: |
          npm ci
          npx playwright install --with-deps chrome
          npm run build
          npm run e2e
        env:
          API_ORIGIN: http://127.0.0.1:8000

  filesystem-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          skip-dirs: apps/web/node_modules
          ignore-unfixed: true
          exit-code: "1"

  # Builds both images, starts the whole stack behind Caddy, seeds the demo, and checks it answers over TLS.
  # This is the first place the container files are exercised (they were written without Docker available).
  packaging:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Generate secrets and validate the compose file
        run: |
          infra/demo/make_env.sh --demo
          docker compose --profile demo config -q
      - name: Build, start, and seed
        run: |
          docker compose --profile demo up -d --build
          docker compose --profile demo wait seed
          docker compose --profile demo logs --no-log-prefix seed | sed 's/[a-z2-9]\{4\}-[a-z2-9]\{4\}-[a-z2-9]\{4\}-[a-z2-9]\{4\}/<password>/'
      - name: Check the running stack
        run: |
          curl -ksf https://localhost/api/v1/health/ready
          curl -ksf https://localhost/login | grep -q "Demo environment"
          curl -ksfI https://localhost/ | grep -i "strict-transport-security"
          curl -ksfI https://localhost/api/v1/health | grep -i "x-content-type-options"
      - name: Show logs on failure
        if: failure()
        run: docker compose --profile demo logs --tail=200
      - name: Scan the images
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: provenance-api:local
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "0"
      - name: Scan the web image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: provenance-web:local
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "0"
