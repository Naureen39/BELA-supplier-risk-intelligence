[project]
name = "provenance-risk-data"
version = "0.1.0"
description = "Data acquisition scripts for the supplier risk intelligence platform"
requires-python = ">=3.11"
dependencies = [
  "httpx",
  "pyyaml",
  "beautifulsoup4",
  "lxml",
  "trafilatura",
  "lingua-language-detector",
  "pandas",
  "pyarrow",
  "duckdb",
  "sqlalchemy",
  "alembic",
  "psycopg[binary]",
  "cleanco",
  "usaddress",
  "rapidfuzz",
  "pandera",
  "networkx",
  "numpy",
  "pydantic>=2",
  "fastapi",
  "uvicorn",
  "prometheus-client",
]

[project.optional-dependencies]
models = ["sentence-transformers", "faiss-cpu", "huggingface-hub"]

[tool.pytest.ini_options]
testpaths = ["tests", "apps/api/tests"]
pythonpath = [".", "apps/api", "apps/api/tests/resolution"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.File", "fastapi.Form", "fastapi.Header"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
strict = true
ignore_missing_imports = true
